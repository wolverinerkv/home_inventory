<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com wss://*.firebaseio.com; frame-src https://*.firebaseapp.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#1f7a52">
<title>Home Pantry</title>
<style>
:root{
  --bg:#f5f4ef;--card:#ffffff;--ink:#1d2421;--muted:#6b746f;--line:#e4e2da;
  --brand:#1f7a52;--brand-ink:#ffffff;--brand-soft:#e3f1ea;
  --warn:#b45309;--warn-soft:#fdf0dc;--bad:#b42318;--bad-soft:#fde7e5;
  --radius:14px;--shadow:0 1px 2px rgba(0,0,0,.05),0 2px 8px rgba(0,0,0,.04);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121614;--card:#1b201d;--ink:#e8ece9;--muted:#9aa49e;--line:#2b322e;
  --brand:#3fb383;--brand-ink:#0d1712;--brand-soft:#1d3329;
  --warn:#f0a548;--warn-soft:#3a2a14;--bad:#f17066;--bad-soft:#3b1b18;
}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:calc(env(safe-area-inset-top) + 8px) 14px calc(env(safe-area-inset-bottom) + 84px)}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 2px 10px}
header h1{font-size:20px;margin:0;letter-spacing:-.01em}
header .sub{color:var(--muted);font-size:12.5px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.banner[hidden]{display:none}
.search{display:flex;gap:8px;margin-bottom:10px}
.search input{flex:1;min-width:0}
input,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--brand)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.group-h{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 4px 6px}
.item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--radius);padding:10px 10px 10px 14px;margin-bottom:8px;box-shadow:var(--shadow)}
.item .main{flex:1;min-width:0;cursor:pointer}
.item .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:12.5px;color:var(--muted)}
.qty{font-variant-numeric:tabular-nums;font-weight:700;font-size:17px;text-align:right;min-width:62px}
.qty small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}
.tag.low{background:var(--warn-soft);color:var(--warn)}
.tag.out{background:var(--bad-soft);color:var(--bad)}
.usebtn{flex:none;border:0;background:var(--brand-soft);color:var(--brand);font-weight:700;border-radius:12px;height:44px;min-width:64px;padding:0 10px;cursor:pointer}
.usebtn:active{transform:scale(.96)}
.usebtn:disabled{opacity:.4}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;background:var(--brand-soft);color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.card{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);margin-bottom:10px}
.card h3{margin:0 0 10px;font-size:15px}
.bar{display:grid;grid-template-columns:110px 1fr auto;gap:8px;align-items:center;font-size:13px;margin:6px 0}
.bar .track{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;background:var(--brand);border-radius:4px}
.bar .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .amt{font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:7px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600}
.ev{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.ev:last-child{border-bottom:0}
.ev .dot{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px}
.ev .dot.buy{background:var(--brand-soft);color:var(--brand)}
.ev .dot.use{background:var(--warn-soft);color:var(--warn)}
.ev .dot.adjust{background:var(--line);color:var(--muted)}
.ev .t{flex:1;min-width:0}
.ev .s{color:var(--muted);font-size:12px}
.ev .p{font-variant-numeric:tabular-nums;white-space:nowrap}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs .in{display:flex;width:100%;max-width:560px}
nav.tabs button{flex:1;border:0;background:none;padding:9px 0 10px;font-size:11.5px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--brand);font-weight:600}
nav.tabs .add{flex:none;width:72px}
nav.tabs .add span.plus{width:46px;height:46px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;margin-top:-20px;box-shadow:0 4px 12px rgba(31,122,82,.35)}
.badge{background:var(--warn);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;margin-left:2px;font-weight:700}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 12px;font-size:18px}
.field{margin-bottom:10px}
.field label{display:block;font-size:12.5px;color:var(--muted);margin:0 0 4px 2px}
.hint{font-size:12px;color:var(--muted);margin:4px 2px 0}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:4px 2px}
.stepper{display:flex;align-items:center;gap:10px;justify-content:center;margin:10px 0 14px}
.stepper button{width:48px;height:48px;border-radius:50%;border:0;background:var(--brand-soft);color:var(--brand);font-size:22px;font-weight:700;cursor:pointer}
.stepper input{width:110px;text-align:center;font-size:22px;font-weight:700}
.session{font-size:13px;color:var(--muted);margin-top:10px}
.session div{padding:4px 0;border-bottom:1px dashed var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 84px);background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 14px;display:flex;gap:14px;align-items:center;z-index:20;font-size:14px;max-width:calc(100% - 28px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast button{background:none;border:0;color:var(--brand);font-weight:700;cursor:pointer}
@media (prefers-color-scheme:light){.toast button{color:#7ee0b2}}
.muted{color:var(--muted)}
.monthbar{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.monthbar button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px}
.monthbar .m{flex:1;text-align:center;font-weight:700;font-size:16px}
.spend{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.seg{display:flex;background:var(--card);border-radius:10px;padding:3px;margin-bottom:10px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;padding:7px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}

.auth{max-width:420px;margin:6vh auto 0}
.auth .logo{width:64px;height:64px;border-radius:18px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;margin:0 auto 14px}
.auth .logo svg{width:34px;height:34px}
.auth h2{text-align:center;margin:0 0 4px;font-size:22px}
.auth p.lead{text-align:center;color:var(--muted);margin:0 0 20px}
.link{background:none;border:0;color:var(--brand);font-weight:600;cursor:pointer;padding:8px}
.center{text-align:center}
textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;font:13px/1.4 ui-monospace,Menlo,monospace;color:inherit;resize:vertical}
.hdr-btn{border:0;background:var(--card);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--muted);box-shadow:var(--shadow)}
.hdr-btn svg{width:20px;height:20px}
.member{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.member:last-child{border-bottom:0}
</style>
</head>
<body>
<div class="app">
  <header id="hdr" hidden>
    <div><h1 id="title">Home Pantry</h1><div class="sub" id="sub"></div></div>
    <button class="hdr-btn" id="settingsBtn" aria-label="Household settings"></button>
  </header>
  <div class="banner" id="banner" hidden></div>
  <main id="view"></main>
</div>
<nav class="tabs" id="nav" hidden><div class="in" id="tabs"></div></nav>
<script src="app.js"></script>
</body>
</html>
