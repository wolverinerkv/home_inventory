# Builds the Home Pantry Android APK on GitHub's servers.
# Push this repo to GitHub, open the "Actions" tab, and download the APK from the run's Artifacts.
# If the 4 signing secrets are set (see README), a signed release APK is built; otherwise a debug APK.
name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The app lives in this subfolder of the repository.
defaults:
  run:
    working-directory: HomePantry-app-source_1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: HomePantry-app-source_1/package-lock.json

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install dependencies (exact versions from package-lock.json)
        run: npm ci --no-audit --no-fund

      - name: Build web app and sync into Android project
        run: |
          npm run build
          npx cap sync android

      - name: Decode signing key
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets set — building a debug APK."
          fi

      - name: Build signed release APK
        if: steps.sign.outputs.signed == 'true'
        working-directory: HomePantry-app-source_1/android
        env:
          HP_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          HP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          HP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          HP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p ../dist && cp app/build/outputs/apk/release/app-release.apk ../dist/HomePantry.apk

      - name: Build debug APK
        if: steps.sign.outputs.signed != 'true'
        working-directory: HomePantry-app-source_1/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p ../dist && cp app/build/outputs/apk/debug/app-debug.apk ../dist/HomePantry-debug.apk

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HomePantry-apk
          path: HomePantry-app-source_1/dist/*.apk
          retention-days: 30
